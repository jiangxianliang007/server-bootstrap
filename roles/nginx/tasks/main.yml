---
- name: Validate Nginx build target
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] is version('26.04', '>=')
      - ansible_facts['service_mgr'] == 'systemd'
      - nginx_version is match('^[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: "Nginx role requires Ubuntu 26.04+ with systemd and a valid version."

- name: Install Nginx compilation dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - libpcre2-dev
      - libssl-dev
      - zlib1g-dev
    state: present
    update_cache: true

- name: Check installed Nginx binary
  ansible.builtin.stat:
    path: "{{ nginx_prefix }}/sbin/nginx"
  register: nginx_binary

- name: Read currently installed Nginx version
  ansible.builtin.command:
    argv: ["{{ nginx_prefix }}/sbin/nginx", "-v"]
  register: nginx_current
  changed_when: false
  failed_when: nginx_current.rc != 0
  when: nginx_binary.stat.exists

- name: Decide if Nginx needs compilation
  ansible.builtin.set_fact:
    nginx_needs_install: "{{ not nginx_binary.stat.exists }}"
    nginx_needs_upgrade: >-
      {{ nginx_binary.stat.exists and (nginx_upgrade | bool)
         and ('nginx/' ~ nginx_version) not in
         (nginx_current.stderr | default('')) }}

- name: Build and install requested Nginx version
  when: nginx_needs_install or nginx_needs_upgrade
  block:
    - name: Create temporary Nginx source directory
      ansible.builtin.tempfile:
        state: directory
        suffix: nginx-build
      register: nginx_build_dir

    - name: Download, compile and deploy Nginx
      block:
        - name: Fetch Nginx source archive
          ansible.builtin.get_url:
            url: "{{ nginx_source_url }}"
            dest: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}.tar.gz"
            checksum: "{{ 'sha256:' ~ nginx_source_sha256 if nginx_source_sha256 | length > 0 else omit }}"
            mode: "0644"

        - name: Extract Nginx source
          ansible.builtin.unarchive:
            src: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}.tar.gz"
            dest: "{{ nginx_build_dir.path }}"
            remote_src: true

        - name: Configure Nginx with HTTP and stream modules
          ansible.builtin.command:
            argv: >-
              {{
                ['./configure',
                 '--prefix=' ~ nginx_prefix,
                 '--with-stream',
                 '--with-stream_ssl_module',
                 '--with-stream_ssl_preread_module',
                 '--with-http_ssl_module',
                 '--with-http_v2_module',
                 '--with-http_gzip_static_module',
                 '--with-http_stub_status_module',
                 '--with-http_realip_module']
                + nginx_configure_extra_args
              }}
            chdir: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}"
          changed_when: true

        - name: Compile Nginx
          ansible.builtin.command:
            argv: ["make", "-j{{ ansible_facts['processor_vcpus'] | default(2) }}"]
            chdir: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}"
          changed_when: true

        - name: Verify newly built binary against existing configuration
          ansible.builtin.command:
            argv:
              - "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}/objs/nginx"
              - "-t"
              - "-p"
              - "{{ nginx_prefix }}/"
              - "-c"
              - "conf/nginx.conf"
          changed_when: false
          when: nginx_needs_upgrade

        - name: Install Nginx for the first time
          ansible.builtin.command:
            argv: ["make", "install"]
            chdir: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}"
          changed_when: true
          when: nginx_needs_install

        - name: Replace Nginx binary without overwriting configuration
          ansible.builtin.copy:
            src: "{{ nginx_build_dir.path }}/nginx-{{ nginx_version }}/objs/nginx"
            dest: "{{ nginx_prefix }}/sbin/nginx"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
            backup: true
          notify: Restart nginx
          when: nginx_needs_upgrade
      always:
        - name: Remove temporary Nginx build directory
          ansible.builtin.file:
            path: "{{ nginx_build_dir.path }}"
            state: absent
          when: nginx_build_dir.path is defined

- name: Install Nginx systemd service
  ansible.builtin.template:
    src: nginx.service.j2
    dest: /etc/systemd/system/nginx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Validate installed Nginx configuration
  ansible.builtin.command:
    argv: ["{{ nginx_prefix }}/sbin/nginx", "-t"]
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
